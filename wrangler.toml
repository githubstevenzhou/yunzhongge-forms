name = "yunzhongge-forms"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# D1 数据库绑定（创建后把 database_id 替换成你自己的）
[[d1_databases]]
binding = "DB"
database_name = "yunzhongge-forms"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# R2 存储桶绑定，用于存放 KV 图和用户上传的身份证/职称图片
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yunzhongge-images"

# 非敏感配置。生产环境请用 `wrangler pages secret put` 设置 JWT_SECRET / ADMIN_PASSWORD
[vars]
ADMIN_USERNAME = "admin"
# 仅用于本地调试，生产环境务必用 secret 覆盖并改成强密码
ADMIN_PASSWORD = "admin123"
JWT_SECRET = "please-change-me-to-a-long-random-string"
