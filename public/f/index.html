<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>信息填写</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;font-size:15px;line-height:1.5}
    .kv{width:100%;aspect-ratio:16/9;background:#e5e7eb center/cover no-repeat;display:block}
    .container{max-width:520px;margin:0 auto;padding:0 16px 80px;background:#fff;min-height:50vh}
    h1{font-size:20px;margin:20px 0 4px;text-align:center}
    .sub{text-align:center;color:#6b7280;font-size:13px;margin:0 0 18px}
    .field{margin:14px 0}
    label{display:block;font-weight:500;margin:0 0 6px;font-size:14px;color:#374151}
    label .req{color:#ef4444;margin-left:2px}
    input[type=text],input[type=tel]{
      width:100%;height:44px;border:1px solid #d1d5db;border-radius:8px;padding:0 12px;font-size:15px;background:#fff;
    }
    input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
    .upload{
      position:relative;display:block;border:1.5px dashed #cbd5e1;border-radius:10px;padding:20px 12px;text-align:center;color:#64748b;background:#fafbfc;cursor:pointer;
    }
    .upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .upload .ph{font-size:28px;color:#9ca3af;margin-bottom:6px}
    .upload .hint{font-size:12px;color:#9ca3af}
    .preview{margin-top:8px;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb}
    .preview img{display:block;width:100%;height:auto}
    .btn{
      width:100%;height:48px;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-size:16px;font-weight:500;cursor:pointer;margin-top:8px;
    }
    .btn:disabled{background:#9ca3af;cursor:not-allowed}
    .btn:hover:not(:disabled){background:#2563eb}
    .err{color:#ef4444;font-size:13px;margin-top:4px}
    .fmt{margin-top:6px;padding:8px 12px;background:#f1f5f9;border-radius:8px;font-family:monospace;font-size:16px;letter-spacing:1px;color:#1e293b;min-height:38px;word-break:break-all;display:flex;align-items:center}
    .fmt.empty{color:#9ca3af;font-size:13px;letter-spacing:0}
    .fmt .seg{display:inline-block}
    .fmt .cursor{display:inline-block;width:2px;height:18px;background:#3b82f6;margin:0 2px;vertical-align:middle;animation:blink 1s steps(2) infinite}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
    .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(16,185,129,.96);color:#fff;padding:14px 22px;border-radius:10px;font-size:15px;z-index:9999;opacity:0;transition:opacity .2s}
    .toast.show{opacity:1}
    .loading{position:fixed;inset:0;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;z-index:9998;font-size:14px;color:#6b7280}
    .missing{text-align:center;padding:60px 20px;color:#6b7280}
    .missing .big{font-size:48px;margin-bottom:8px}
    .foot{text-align:center;color:#9ca3af;font-size:11px;padding:24px 0}
  </style>
</head>
<body>
  <div id="app">
    <div class="loading" id="loading">加载中…</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const apiBase = '';
    const $ = (s) => document.querySelector(s);

    function showToast(msg, ok = true) {
      const t = $('#toast');
      t.textContent = msg;
      t.style.background = ok ? 'rgba(16,185,129,.96)' : 'rgba(239,68,68,.96)';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function getSlug() {
      const m = location.pathname.match(/\/f\/([^/?#]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }

    function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

    async function loadForm() {
      const slug = getSlug();
      if (!slug) return renderMissing('链接无效');
      try {
        const res = await fetch(`${apiBase}/api/forms/${encodeURIComponent(slug)}`);
        if (!res.ok) {
          if (res.status === 404) return renderMissing('表单不存在或已下线');
          throw new Error('加载失败');
        }
        const form = await res.json();
        renderForm(form);
      } catch (e) {
        renderMissing('加载失败，请刷新重试');
      } finally {
        $('#loading')?.remove();
      }
    }

    function renderMissing(msg) {
      $('#loading')?.remove();
      $('#app').innerHTML = `
        <div class="missing">
          <div class="big">:(</div>
          <div>${escapeHtml(msg)}</div>
        </div>`;
    }

    function renderForm(form) {
      $('#loading')?.remove();
      const kvStyle = form.kv_image_url
        ? `background-image:url('${escapeHtml(form.kv_image_url)}')`
        : '';
      $('#app').innerHTML = `
        <div class="kv" style="${kvStyle}"></div>
        <div class="container">
          <h1>${escapeHtml(form.name)}</h1>
          <p class="sub">请如实填写以下信息</p>
          <form id="form" enctype="multipart/form-data">
            <div class="field">
              <label>姓名<span class="req">*</span></label>
              <input type="text" name="name" required maxlength="32" placeholder="请输入姓名" />
            </div>
            <div class="field">
              <label>手机号<span class="req">*</span></label>
              <input type="tel" name="phone" required maxlength="11" placeholder="11 位手机号" inputmode="numeric" autocomplete="off" />
              <div class="fmt" data-for="phone"></div>
            </div>
            <div class="field">
              <label>身份证号<span class="req">*</span></label>
              <input type="text" name="id_card" required maxlength="18" placeholder="18 位身份证号" autocomplete="off" />
              <div class="fmt" data-for="id_card"></div>
            </div>
            <div class="field">
              <label>银行卡号<span class="req">*</span></label>
              <input type="text" name="bank_card" required maxlength="30" placeholder="银行卡号" inputmode="numeric" autocomplete="off" />
              <div class="fmt" data-for="bank_card"></div>
            </div>
            <div class="field">
              <label>开户行<span class="req">*</span></label>
              <input type="text" name="bank_name" required maxlength="60" placeholder="如：中国工商银行xx支行" />
            </div>

            ${uploadField('id_front', '身份证正面', '请上传身份证人像面')}
            ${uploadField('id_back', '身份证反面', '请上传身份证国徽面')}
            ${uploadField('cert', '职称证明', '请上传职称证明照片')}

            <button class="btn" type="submit" id="submitBtn">提交信息</button>
            <div class="err" id="formErr"></div>
          </form>
          <div class="foot">信息提交后即视为同意收集使用</div>
        </div>`;

      // 预览逻辑
      document.querySelectorAll('.upload').forEach(box => {
        const input = box.querySelector('input');
        const preview = box.parentElement.querySelector('.preview');
        input.addEventListener('change', () => {
          const f = input.files[0];
          if (f) {
            const url = URL.createObjectURL(f);
            preview.innerHTML = `<img src="${url}" alt="预览" />`;
            box.querySelector('.hint').textContent = f.name;
          }
        });
      });

      // ---------- 输入格式化预览 ----------
      // 手机号：3-4-4 ；身份证号：6-4-4-4 ；银行卡号：每 4 位一段
      // 仅做预览显示，提交时仍提交输入框中的原始值（已被清洗成纯数字/末位X）
      const fmtRules = {
        phone: { clean: (v) => v.replace(/\D/g, '').slice(0, 11), split: (d) => [d.slice(0,3), d.slice(3,7), d.slice(7,11)].filter(Boolean), placeholder: '预览：138 1234 5678' },
        id_card: { clean: (v) => v.replace(/[^0-9Xx]/g, '').toUpperCase().slice(0, 18), split: (d) => [d.slice(0,6), d.slice(6,10), d.slice(10,14), d.slice(14,18)].filter(Boolean), placeholder: '预览：110101 1990 0101 001X' },
        bank_card: { clean: (v) => v.replace(/\D/g, '').slice(0, 30), split: (d) => d.match(/.{1,4}/g) || [], placeholder: '预览：6212 1234 5678 9012' },
      };

      function updateFmt(input) {
        const rule = fmtRules[input.name];
        if (!rule) return;
        const el = document.querySelector(`.fmt[data-for="${input.name}"]`);
        if (!el) return;
        const cleaned = rule.clean(input.value);
        if (cleaned !== input.value) input.value = cleaned;
        const parts = rule.split(cleaned);
        if (parts.length === 0) {
          el.className = 'fmt empty';
          el.textContent = rule.placeholder;
        } else {
          el.className = 'fmt';
          el.innerHTML = parts.map(p => `<span class="seg">${escapeHtml(p)}</span>`).join(' ') + '<span class="cursor"></span>';
        }
      }

      Object.keys(fmtRules).forEach(name => {
        const input = $('#form').elements[name];
        if (input) {
          input.addEventListener('input', () => updateFmt(input));
          input.addEventListener('focus', () => updateFmt(input));
          updateFmt(input);
        }
      });

      $('#form').addEventListener('submit', onSubmit);
    }

    function uploadField(name, label, placeholder) {
      return `
        <div class="field">
          <label>${label}<span class="req">*</span></label>
          <label class="upload">
            <div class="ph">+</div>
            <div class="hint">${placeholder}（JPG/PNG/WebP，≤10MB）</div>
            <input type="file" name="${name}" accept="image/jpeg,image/png,image/webp" required />
          </label>
          <div class="preview"></div>
        </div>`;
    }

    // 上传前用 canvas 压缩图片：最长边 1600px，JPEG 质量 0.85
    // 原图 3-8MB → 200-500KB，后台加载秒开，ZIP 导出也不会超限
    function compressImage(file, maxSide = 1600, quality = 0.85) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith('image/')) { resolve(file); return; }
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          let { naturalWidth: w, naturalHeight: h } = img;
          if (w > maxSide || h > maxSide) {
            if (w >= h) { h = Math.round(h * maxSide / w); w = maxSide; }
            else { w = Math.round(w * maxSide / h); h = maxSide; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob(b => {
            if (b) resolve(b);
            else reject(new Error('压缩失败'));
          }, 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片加载失败')); };
        img.src = url;
      });
    }

    async function onSubmit(e) {
      e.preventDefault();
      const errEl = $('#formErr');
      errEl.textContent = '';
      const btn = $('#submitBtn');
      btn.disabled = true;
      btn.textContent = '正在处理图片…';
      try {
        const slug = getSlug();
        const fd = new FormData($('#form'));
        // 替换为压缩后的图片（id_front / id_back / cert）
        for (const name of ['id_front', 'id_back', 'cert']) {
          const input = $('#form').elements[name];
          if (input && input.files[0]) {
            btn.textContent = `压缩中：${name === 'id_front' ? '身份证正面' : name === 'id_back' ? '身份证反面' : '职称证明'}…`;
            const compressed = await compressImage(input.files[0]);
            fd.set(name, compressed, input.files[0].name.replace(/\.(png|webp)$/i, '.jpg'));
          }
        }
        btn.textContent = '提交中…';
        const res = await fetch(`${apiBase}/api/forms/${encodeURIComponent(slug)}/submit`, {
          method: 'POST',
          body: fd,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '提交失败');
        showToast('提交成功，感谢您的配合');
        $('#form').reset();
        document.querySelectorAll('.preview').forEach(p => p.innerHTML = '');
        document.querySelectorAll('.upload .hint').forEach((h, i) => {
          h.textContent = ['请上传身份证人像面','请上传身份证国徽面','请上传职称证明照片'][i] + '（JPG/PNG/WebP，≤10MB）';
        });
      } catch (err) {
        errEl.textContent = err.message;
        showToast(err.message, false);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交信息';
      }
    }

    loadForm();
  </script>
</body>
</html>
